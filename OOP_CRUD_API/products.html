<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products</title><link rel="stylesheet" href="assets/css/style.css">
</head>
<body><main class="container">
  <nav><a href="index.html">Home</a> · <a href="categories.html">Categories</a> · <a href="users.html">Users</a></nav>
  <h1>Products</h1>
  <section class="panel">
    <h2 id="form-title">Add product</h2>
    <form id="product-form">
      <input type="hidden" id="product-id">
      <label>Name <input id="name" name="name" required maxlength="100"></label>
      <label>Description <textarea id="description" name="description"></textarea></label>
      <div class="row">
        <label>Price <input id="price" name="price" type="number" min="0" step="0.01" required></label>
        <label>Quantity <input id="quantity" name="quantity" type="number" min="0" step="1" required></label>
      </div>
      <label>Category <select id="category_id" name="category_id" required><option value="">Loading categories…</option></select></label>
      <label>Image (JPG, PNG, GIF, WEBP; max 2 MB) <input id="image" name="image" type="file" accept=".jpg,.jpeg,.png,.gif,.webp,image/*"></label>
      <div class="actions"><button type="submit">Save product</button><button type="button" class="secondary" id="cancel-edit">Clear / Cancel edit</button></div>
    </form>
    <p id="form-message" class="message" aria-live="polite"></p>
  </section>
  <h2>Product list</h2><p id="list-message" class="message" aria-live="polite"></p>
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Image</th><th>Name</th><th>Description</th><th>Price</th><th>Qty</th><th>Category</th><th>Actions</th></tr></thead><tbody id="products-body"></tbody></table></div>
</main><script src="assets/js/api.js"></script><script src="assets/js/products.js"></script></body></html>
