<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categories</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><main class="container">
<nav><a href="index.html">Home</a> · <a href="products.html">Products</a> · <a href="users.html">Users</a></nav>
<h1>Categories</h1>
<section class="panel"><h2 id="form-title">Add category</h2>
<form id="category-form"><input type="hidden" id="category-id">
<label>Name <input id="name" required maxlength="100"></label>
<label>Description <textarea id="description" maxlength="255"></textarea></label>
<div class="actions"><button type="submit">Save category</button><button type="button" class="secondary" id="cancel-edit">Clear / Cancel edit</button></div></form>
<p id="form-message" class="message" aria-live="polite"></p></section>
<h2>Category list</h2><p id="list-message" class="message" aria-live="polite"></p>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead><tbody id="categories-body"></tbody></table></div>
</main><script src="assets/js/api.js"></script><script src="assets/js/categories.js"></script></body></html>
